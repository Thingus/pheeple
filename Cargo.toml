[package]
name = "pheeples"
version = "0.2.0-pre"
edition = "2024"


[dependencies]
args = "2.2.0"
bevy = "0.17.1"
big_space = "0.11.0"
dbase = "0.6.1"
geo = "0.31.0"
geojson = { version = "0.24.2", features = ["geo-types"] }
getopts = "0.2.24"
rand = "0.9.2"
shapefile = { version = "0.7.0", features = ["geo-types"] }
uuid = "1.18.1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1


# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

